<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>vivo 账号登录</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14171f; overflow: hidden; }
    webview { width: 100%; height: 100%; border: 0; }
    #tip { color: #8892aa; font: 12px/1.6 system-ui, sans-serif; padding: 8px 12px; }
  </style>
</head>
<body>
  <div id="tip">正在打开 vivo 账号登录…</div>
  <webview id="wv" partition="persist:login" allowpopups></webview>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    const wv = document.getElementById('wv');
    document.getElementById('tip').textContent = src ? '' : '缺少 src 参数';

    // 与 PC Suite preload-welcome.js 相同的拦截策略：
    // passport 登录成功后 302 到 vbusiness/account/cookie/getHtml，
    // 服务端渲染一个带 hidden input 的页面，value 为 7 段 & 分隔的凭据。
    wv.addEventListener('dom-ready', async () => {
      const url = wv.getURL();
      if (url.includes('vbusiness/account/cookie/getHtml')) {
        try {
          const raw = await wv.executeJavaScript(
            `(function(){
               const el = document.querySelector('input[type=hidden]');
               return el ? el.value : '';
             })()`, true);
          if (raw) {
            window.__notifyHost('login-success', { rawValue: raw });
          }
        } catch (e) {
          console.error('抓取 cookie 失败', e);
        }
      }
    });

    wv.addEventListener('did-start-loading', () => { document.getElementById('tip').textContent = '加载中…'; });
    wv.addEventListener('did-stop-loading', () => { document.getElementById('tip').textContent = ''; });

    wv.src = src;
  </script>
</body>
</html>
