<!doctype html>
<html lang="zh" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>vivo办公套件</title>
  <style>
    /* ============ 从 PC Suite 真实 bundle 提取的设计令牌 ============
       --main_blue #0f77ff / --bg-61 #415fff / --text-41 rgba(0,0,0,.9)
       .note-item: padding 12px 20px, radius 3px, margin-bottom 4px, flex
       .note-item .cnt .tt: 16px/700 标题；.desc: 13px/18px 单行省略
       .note-item .suffix: width 150px 右对齐时间
       .sidebar-item: height 40px, margin 4px 24px, radius 6px, padding 0 12px
       .note__main: padding 14px；.note-container: padding 14px 16px
       .folderBreadCrump: sticky top, padding-inline-start 36px
    ================================================================ */
    :root {
      --main-blue: #0f77ff;
      --accent: #415fff;
      --txt-black: rgba(0,0,0,.9);
      --text-13: #606266;
      --text-8: #999;
      --text-23: #c0c4cc;
      --text-27: rgba(0,0,0,.3);
      --text-35: rgba(0,0,0,.5);
      --text-36: rgba(0,0,0,.59);
      --bg-0: #fff;
      --bg-5: #f1f1f1;
      --bg-9: #f5f5f5;
      --bg-12: #f6f7f8;
      --bg-44: rgba(0,0,0,.03);
      --bg-45: rgba(0,0,0,.04);
      --bg-47: rgba(0,0,0,.08);
      --border-22: rgba(0,0,0,.08);
      --hover-bgc: rgba(0,0,0,.04);
      --active-bgc: rgba(15,119,255,.08);
      --sidebar-w: 210px;
      --list-w: 290px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font: 14px/1.6 "vivo Sans SC VF", "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--txt-black);
      background: var(--bg-0);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
    input, textarea { font: inherit; color: inherit; }

    /* ============ 顶部标题栏 ============ */
    .titlebar {
      height: 48px; display: flex; align-items: center; padding: 0 16px;
      -webkit-app-region: drag; gap: 12px; flex-shrink: 0;
    }
    .titlebar .logo { width: 22px; height: 22px; border-radius: 5px; background: var(--main-blue);
      color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .titlebar .app-name { font-size: 14px; font-weight: 500; }
    .titlebar .sp { flex: 1; }
    .titlebar .actions { -webkit-app-region: no-drag; display: flex; gap: 8px; align-items: center; }

    /* ============ 三栏主体 ============ */
    .layout { display: flex; height: calc(100vh - 48px); }

    /* --- 左栏：笔记本侧边栏 --- */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--border-22); padding-top: 4px;
    }
    .sidebar .new-note {
      margin: 8px 24px 12px; height: 36px; border-radius: 8px;
      background: var(--main-blue); color: #fff; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .sidebar .new-note:hover { background: #0b68df; }
    .sidebar-item {
      display: flex; align-items: center; height: 40px; margin: 4px 12px; padding: 0 12px;
      border-radius: 6px; cursor: pointer; gap: 8px; transition: background .1s ease-in-out;
    }
    .sidebar-item .icon { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .sidebar-item .text { flex: 1; font-size: 14px; font-weight: 500; color: var(--text-13);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-item .count { font-size: 12px; color: var(--text-8); }
    .sidebar-item:hover { background: var(--hover-bgc); }
    .sidebar-item.active { background: var(--active-bgc); }
    .sidebar-item.active .text { color: var(--main-blue); }
    .sidebar .divider { height: 1px; background: var(--border-22); margin: 8px 24px; }
    .sidebar .spacer { flex: 1; }
    .sidebar .account {
      display: flex; align-items: center; gap: 10px; padding: 14px 24px; cursor: pointer;
      border-top: 1px solid var(--border-22);
    }
    .sidebar .account .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-5);
      display: flex; align-items: center; justify-content: center; color: var(--text-8); font-size: 14px; flex-shrink: 0; }
    .sidebar .account .who { font-size: 13px; color: var(--text-13); overflow: hidden; text-overflow: ellipsis; }

    /* --- 中栏：笔记列表 --- */
    .list-pane {
      width: var(--list-w); flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--border-22); background: var(--bg-12);
    }
    .list-pane .search-wrap { padding: 10px 12px; }
    .list-pane .search {
      display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
      background: var(--bg-0); border: 1px solid var(--border-22); border-radius: 8px;
    }
    .list-pane .search input { border: 0; outline: 0; flex: 1; background: transparent; font-size: 13px; }
    .list-pane .search input::placeholder { color: var(--text-23); }
    .list-pane .folder-crumb {
      position: sticky; top: 0; z-index: 13; padding: 6px 16px 12px 36px;
      font-size: 16px; font-weight: 700; background: var(--bg-12);
    }
    .note-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .note-list::-webkit-scrollbar { width: 6px; }
    .note-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }

    /* 真实 .note-item 结构：[prefix] .cnt(.tt+.desc+.doc(.desc+.date-info)) [suffix] */
    .note-item {
      display: flex; align-items: center; padding: 12px 20px; margin-bottom: 4px;
      border: 1px solid transparent; border-radius: 3px; cursor: pointer; background: var(--bg-0);
    }
    .note-item:hover { background: var(--bg-0); border-color: var(--border-22); }
    .note-item.active { border-color: var(--main-blue); background: var(--active-bgc); }
    .note-item .prefix { flex-shrink: 0; display: flex; align-items: center; width: 0; }
    .note-item .top-flag { width: 6px; height: 6px; border-radius: 50%; background: var(--main-blue); margin-right: 8px; }
    .note-item .cnt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .note-item .tt { font-size: 16px; font-weight: 700; color: var(--txt-black);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note-item .desc { margin: 4px 0; font-size: 13px; line-height: 18px; color: var(--text-36);
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .note-item .doc { display: flex; align-items: baseline; margin-top: 6px; font-size: 13px; gap: 4px; }
    .note-item .doc .desc { margin: 0; color: var(--text-35); font-weight: 400; }
    .note-item .doc .date-info { margin-left: 8px; margin-top: 0; display: flex; gap: 4px; color: var(--text-8); font-size: 12px; white-space: nowrap; }
    .note-item .suffix { flex-shrink: 0; width: 60px; display: flex; align-items: center; justify-content: flex-end;
      color: var(--text-27); font-size: 14px; white-space: nowrap; }
    .note-item:hover .suffix { color: var(--text-35); }
    .note-item .dirty { color: var(--main-blue); font-size: 11px; }
    .note-item .book-tag { color: var(--text-35); font-size: 11px; margin-left: 6px; }

    /* --- 右栏：编辑器 --- */
    .editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-0); }
    .editor-toolbar {
      height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 20px;
      border-bottom: 1px solid var(--border-22); flex-shrink: 0;
    }
    .editor-toolbar .tb {
      width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: var(--text-13); font-size: 15px;
    }
    .editor-toolbar .tb:hover { background: var(--hover-bgc); }
    .editor-toolbar .tb.on { background: var(--active-bgc); color: var(--main-blue); }
    .editor-toolbar .tb-div { width: 1px; height: 20px; background: var(--border-22); margin: 0 8px; }
    .editor-toolbar .sp { flex: 1; }
    .editor-toolbar .save-state { font-size: 12px; color: var(--text-8); margin-right: 12px; }
    .btn-primary {
      height: 32px; padding: 0 18px; border-radius: 8px; background: var(--main-blue);
      color: #fff; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;
    }
    .btn-primary:hover { background: #0b68df; }
    .btn-primary:disabled { background: var(--text-23); cursor: default; }
    .btn-ghost { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-22);
      color: var(--text-13); font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .btn-ghost:hover { background: var(--hover-bgc); }

    .editor-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .editor-body .note-container { padding: 14px 16px; max-width: 860px; margin: 0 auto;
      display: flex; flex-direction: column; height: calc(100vh - 240px); }
    .editor-body .heading { padding-bottom: 1px; flex-shrink: 0; }
    .editor-body .title-input {
      width: 100%; border: 0; outline: 0; font-size: 26px; font-weight: 700; color: var(--txt-black);
      background: transparent; padding: 8px 0;
    }
    .editor-body .title-input::placeholder { color: var(--text-23); }
    .editor-body .meta-line { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-8); padding: 4px 0 14px; flex-shrink: 0; }
    /* TinyMCE 容器撑满剩余高度 */
    .editor-body #content-wrap { flex: 1; min-height: 0; }
    .tox-tinymce { border: 0 !important; border-radius: 0 !important; }
    .tox .tox-edit-area::before { border-color: var(--border-22) !important; opacity: 1 !important; }
    .editor-body .content-input {
      width: 100%; min-height: 420px; border: 0; outline: 0; resize: none; background: transparent;
      font-size: 15px; line-height: 1.8; color: var(--txt-black);
    }
    .editor-body .content-input::placeholder { color: var(--text-23); }
    .empty-editor { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-8); gap: 12px; }
    .empty-editor .big { font-size: 48px; opacity: .25; }

    /* toast */
    #toast {
      position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
      background: rgba(40,40,40,.85); color: #fff; padding: 9px 20px; border-radius: 20px;
      font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 99;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="logo">v</div>
    <span class="app-name">vivo办公套件 · 笔记（复刻）</span>
    <span class="sp"></span>
    <div class="actions">
      <button class="btn-ghost" id="btn-sync">⟳ 同步</button>
    </div>
  </div>

  <div class="layout">
    <!-- 左栏 -->
    <aside class="sidebar">
      <button class="new-note" id="btn-new">＋ 新建笔记</button>
      <div id="book-list">
        <div class="sidebar-item active" data-book="-2">
          <span class="icon">📒</span><span class="text">全部笔记</span><span class="count" id="cnt-all"></span>
        </div>
        <div class="sidebar-item" data-book="0">
          <span class="icon">📂</span><span class="text">未分类</span>
        </div>
        <div class="sidebar-item" data-book="recycle">
          <span class="icon">🗑️</span><span class="text">最近删除</span>
        </div>
        <div class="sidebar-item" data-book="encrypt">
          <span class="icon">🔒</span><span class="text">私密笔记</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="sidebar-item" id="btn-settings">
        <span class="icon">⚙️</span><span class="text">设置</span>
      </div>
      <div class="spacer"></div>
      <div class="account" id="btn-login">
        <div class="avatar" id="avatar">?</div>
        <span class="who" id="who">点击登录 vivo 账号</span>
      </div>
    </aside>

    <!-- 中栏 -->
    <section class="list-pane">
      <div class="search-wrap">
        <div class="search">🔍<input id="q" placeholder="搜索笔记"></div>
      </div>
      <div class="folder-crumb" id="crumb">全部笔记</div>
      <div class="note-list" id="list"></div>
    </section>

    <!-- 右栏 -->
    <section class="editor-pane">
      <div class="editor-toolbar" id="toolbar" style="display:none">
        <button class="tb" title="加粗"><b>B</b></button>
        <button class="tb" title="斜体"><i>I</i></button>
        <button class="tb" title="下划线"><u>U</u></button>
        <button class="tb" title="删除线"><s>S</s></button>
        <div class="tb-div"></div>
        <button class="tb" title="标题">H</button>
        <button class="tb" title="列表">☰</button>
        <button class="tb" title="待办">☑</button>
        <button class="tb" title="图片">🖼</button>
        <div class="sp"></div>
        <span class="save-state" id="save-state"></span>
        <button class="btn-primary" id="btn-save">保存</button>
      </div>
      <div class="editor-body" id="editor-body" style="display:none">
        <div class="note-container">
          <div class="heading"><input class="title-input" id="title" placeholder="标题"></div>
          <div class="meta-line"><span id="meta-time"></span><span id="meta-dirty"></span></div>
          <div id="content-wrap"><textarea id="content"></textarea></div>
        </div>
      </div>
      <div class="empty-editor" id="empty-editor">
        <div class="big">📝</div>
        <div>选择或新建一篇笔记</div>
      </div>
    </section>
  </div>

  <div id="toast"></div>
  <script src="static/tinymce/tinymce.min.js"></script>
  <script src="editor.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
